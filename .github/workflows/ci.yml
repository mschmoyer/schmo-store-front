name: CI

# The repository had no CI at all. A 500-file change could land with a broken
# build, a failing migration or an unauthenticated endpoint and nothing would
# say so. These jobs are the floor.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # next.config.ts still sets typescript.ignoreBuildErrors, so `next build`
      # will happily ship type errors. This job is the thing that actually
      # enforces them; do not remove it when that flag comes off.
      - run: npx tsc --noEmit

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # The suite needs a real Postgres. `CLAUDE.md` says to prefer real data over mocks wherever a
    # boundary can be injected, and the platform console's queries are exactly the case that rule
    # is written for: they are almost entirely SQL, so a mocked `db.query` would assert that the
    # code calls a function, not that the numbers are right. `src/lib/platform/__tests__` therefore
    # calls `jest.unmock('@/lib/database/connection')` and talks to the database.
    #
    # This job had no database, so those tests passed locally and could only ever fail here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rebelshops_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rebelshops_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Schema only. The tests seed and clean up their own rows, deliberately: a suite that asserts
      # against demo data breaks whenever the demo data is edited, which is a different failure
      # from the one it is supposed to report.
      - run: node database/migrate.js
      - run: npm run test:ci

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rebelshops_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rebelshops_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Migrations run from the Vercel build command, so a broken migration is a
      # broken deploy. The previous runner never recorded which files it had
      # applied, so migrations re-ran on every deploy and the non-idempotent ones
      # failed. These three steps are precisely the regression test for that.
      - name: Apply migrations to a clean database
        run: node database/migrate.js

      - name: Re-run must be a clean no-op
        run: |
          out=$(node database/migrate.js 2>&1)
          echo "$out"
          if echo "$out" | grep -qiE "applying|running "; then
            echo "::error::Re-running migrations was not a no-op. Tracking is broken."
            exit 1
          fi

      - name: Status reports nothing pending
        run: |
          out=$(node database/migrate.js --status 2>&1)
          echo "$out"
          echo "$out" | grep -q "0 pending" \
            || { echo "::error::Migrations still pending after a full apply."; exit 1; }

      - name: Seed demo data, twice, to prove it is idempotent
        run: |
          node scripts/seed-demo.js
          node scripts/seed-demo.js

      # Several rules — a product always having a variant, an option combination
      # being unique within it, a value belonging to its own option — live in
      # triggers and deferred constraints rather than in a column type. Those are
      # what a later migration disarms by accident: a CASCADE that takes a trigger
      # with it, a constraint recreated without DEFERRABLE. This runs them as
      # behaviour, so the disarming shows up here rather than in production data.
      - name: Schema invariants are still enforced
        run: node database/verify-schema-invariants.js

  build:
    name: Production build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rebelshops_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rebelshops_ci
      # Build-time only. Never a real secret — every Stripe/ShipStation entry
      # point is required to degrade gracefully when unconfigured, and this job
      # is part of how we keep that true.
      #
      # JWT_SECRET is the one variable that does NOT degrade:
      # src/lib/auth/jwt-secret.ts throws on a missing, short (<32 char) or
      # known-placeholder value, because a fallback secret lets anyone forge a
      # session for any store. So this value has to clear the length floor even
      # though it is public — it must never be used anywhere real.
      JWT_SECRET: ci-build-only-not-a-secret-padded-to-clear-the-length-floor
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node database/migrate.js
      - run: npm run build

  # End-to-end. Added because a real regression walked straight through every
  # other job in this file: making JWT_SECRET fail closed as a module-level
  # const broke the customizer's preview pane, because a client component
  # imports a module that transitively imports the secret and a browser bundle
  # has no environment. Lint, typecheck, 922 unit tests and the production
  # build were all green; six Playwright tests were red. Nothing here ran them.
  #
  # Chromium only, matching what a session container can run, and the two specs
  # that cover the surfaces a merchant and a shopper actually touch.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rebelshops_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rebelshops_ci
      # Same rationale as the build job: public, build-time only, long enough
      # to clear the floor.
      JWT_SECRET: ci-e2e-only-not-a-secret-padded-to-clear-the-length-floor
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node database/migrate.js
      - run: node scripts/seed-demo.js
      # `playwright.config.js` starts (or reuses) the dev server itself.
      - run: npx playwright test tests/e2e/storefront.spec.js tests/e2e/customizer.spec.js --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
